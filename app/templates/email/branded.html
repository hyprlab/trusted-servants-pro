{#- Branded notification email: the shared HTML style every app email
   renders through (contact form, custom forms, story / event /
   announcement submissions, recovery-contact requests, account and
   access emails). Email-safe: table layout + inline styles only (no
   <style>, flexbox or grid). Images are hosted URLs so they work across
   the SMTP and relay transports; the layout reads fine even when a client
   blocks images.

   Context:
     site_name, site_logo_url, tspro_logo_url — branding
     site_home_url — optional public site URL the header logo links to
     title        — headline (form / subject title)
     submitted    — optional "submitted at" string, shown in the header
     intro        — optional short paragraph under the title; also the
                    inbox preview text
     sections     — list of {heading (optional), rows: [...]}
                    each row is either {label, value, type} (plain) or
                    {label, options:[{text}], multi} (checkbox/radio)
     files        — optional list of {name, label}
     cta_url/cta_label — optional primary button
     buttons      — optional list of {url, label, style}
     meta_text    — optional small line above the footer (e.g. "IP 1.2.3.4")
     meta_url/meta_url_label — optional link on that line
-#}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background:#eef2f8; -webkit-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ intro or title }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f8;">
    <tr>
      <td align="center" style="padding:28px 14px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 10px 34px rgba(15,23,42,0.10); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

          {#- Blue accent bar -#}
          <tr><td style="height:4px; line-height:4px; font-size:0; background:#0b5cff;">&nbsp;</td></tr>

          {#- Header: site logo (or name) left, submitted time right -#}
          <tr>
            <td style="padding:28px 32px; border-bottom:1px solid #e9eef5;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
                <td valign="middle">
                  {% if site_home_url %}<a href="{{ site_home_url }}" target="_blank" style="color:#0f172a; text-decoration:none;">{% endif %}
                  {% if site_logo_url %}
                  <img src="{{ site_logo_url }}" alt="{{ site_name }}" height="32" style="height:32px; width:auto; max-width:220px; display:block; border:0;">
                  {% else %}
                  <div style="font-size:16px; font-weight:700; color:#0f172a;">{{ site_name }}</div>
                  {% endif %}
                  {% if site_home_url %}</a>{% endif %}
                </td>
                {% if submitted %}
                <td valign="middle" align="right" style="font-size:13px; color:#64748b; padding-left:12px;">{{ submitted }}</td>
                {% endif %}
              </tr></table>
            </td>
          </tr>

          {#- Title + intro -#}
          <tr>
            <td style="padding:26px 32px 6px;">
              <div style="font-size:20px; font-weight:700; color:#0f172a; line-height:1.3;">{{ title }}</div>
              {% if intro %}<div style="font-size:15px; line-height:1.6; color:#334155; margin-top:8px; white-space:pre-line;">{{ intro }}</div>{% endif %}
            </td>
          </tr>

          {#- Sections of labelled fields, then attachments, as label / value rows -#}
          {% for section in sections %}
          {% if section.rows %}
          <tr>
            <td style="padding:14px 32px 0;">
              {% if section.heading %}
              <div style="font-size:15px; font-weight:600; color:#0f172a; padding:6px 0 8px;">{{ section.heading }}</div>
              {% endif %}
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e9eef5;">
                {% for f in section.rows %}
                <tr>
                  <td valign="top" style="width:32%; padding:11px 12px 11px 0; border-bottom:1px solid #e9eef5; font-size:14px; line-height:1.5; color:#64748b;">{{ f.label }}</td>
                  <td valign="top" style="padding:11px 0; border-bottom:1px solid #e9eef5; font-size:14px; line-height:1.55; color:#0f172a;">
                    {% if f.options is defined %}
                      {% for opt in f.options %}
                      <div{% if not loop.first %} style="margin-top:3px;"{% endif %}><span style="color:#0b5cff; font-weight:700;">&#10003;</span>&nbsp; {{ opt.text }}</div>
                      {% else %}
                      <span style="color:#94a3b8;">None</span>
                      {% endfor %}
                    {% elif f.type == 'email' and f.value %}
                      <a href="mailto:{{ f.value }}" style="color:#0b5cff; text-decoration:none;">{{ f.value }}</a>
                    {% elif f.type == 'phone' and f.value %}
                      <a href="tel:{{ f.value }}" style="color:#0b5cff; text-decoration:none;">{{ f.value }}</a>
                    {% elif f.type == 'url' and f.value %}
                      <a href="{{ f.value }}" style="color:#0b5cff; text-decoration:none; word-break:break-all;">{{ f.value }}</a>
                    {% elif f.value is defined and f.value %}
                      <div style="white-space:pre-line;">{{ f.value }}</div>
                    {% else %}
                      <span style="color:#94a3b8;">Not answered</span>
                    {% endif %}
                  </td>
                </tr>
                {% endfor %}
              </table>
            </td>
          </tr>
          {% endif %}
          {% endfor %}

          {% if files %}
          <tr>
            <td style="padding:14px 32px 0;">
              <div style="font-size:15px; font-weight:600; color:#0f172a; padding:6px 0 8px;">Attachments</div>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e9eef5;">
                {% for file in files %}
                <tr>
                  <td valign="top" style="width:32%; padding:11px 12px 11px 0; border-bottom:1px solid #e9eef5; font-size:14px; line-height:1.5; color:#64748b;">{{ file.label or 'File' }}</td>
                  <td valign="top" style="padding:11px 0; border-bottom:1px solid #e9eef5; font-size:14px; line-height:1.55; color:#0f172a; word-break:break-all;">{{ file.name }}</td>
                </tr>
                {% endfor %}
              </table>
            </td>
          </tr>
          {% endif %}

          {#- Buttons. ``cta_url``/``cta_label`` render one primary button;
             ``buttons`` (list of {url, label, style}) renders several side by
             side: style 'primary' (default, filled blue), 'secondary'
             (outline) or 'danger' (outline red). -#}
          {% if cta_url or buttons %}
          <tr>
            <td style="padding:22px 32px 4px;">
              {% if cta_url %}
              <a href="{{ cta_url }}" style="display:inline-block; margin:0 8px 8px 0; background:#0b5cff; color:#ffffff; border:1px solid #0b5cff; text-decoration:none; font-size:14px; font-weight:600; line-height:1; padding:11px 20px; border-radius:8px;">{{ cta_label or 'Open in app' }}</a>
              {% endif %}
              {% for b in buttons %}
              {% if b.style == 'secondary' %}
              <a href="{{ b.url }}" style="display:inline-block; margin:0 8px 8px 0; background:#ffffff; color:#0b5cff; border:1px solid #c7d2e8; text-decoration:none; font-size:14px; font-weight:600; line-height:1; padding:11px 20px; border-radius:8px;">{{ b.label }}</a>
              {% elif b.style == 'danger' %}
              <a href="{{ b.url }}" style="display:inline-block; margin:0 8px 8px 0; background:#ffffff; color:#b91c1c; border:1px solid #f2c2c2; text-decoration:none; font-size:14px; font-weight:600; line-height:1; padding:11px 20px; border-radius:8px;">{{ b.label }}</a>
              {% else %}
              <a href="{{ b.url }}" style="display:inline-block; margin:0 8px 8px 0; background:#0b5cff; color:#ffffff; border:1px solid #0b5cff; text-decoration:none; font-size:14px; font-weight:600; line-height:1; padding:11px 20px; border-radius:8px;">{{ b.label }}</a>
              {% endif %}
              {% endfor %}
            </td>
          </tr>
          {% endif %}

          {#- Meta line (IP / link / note) -#}
          {% if meta_text or meta_url %}
          <tr>
            <td style="padding:14px 32px 0;">
              <div style="font-size:12px; color:#94a3b8; line-height:1.6;">
                {% if meta_url %}<a href="{{ meta_url }}" style="color:#64748b; text-decoration:none;">{{ meta_url_label or meta_url }}</a>{% if meta_text %} &nbsp;·&nbsp; {% endif %}{% endif %}{{ meta_text or '' }}
              </div>
            </td>
          </tr>
          {% endif %}

          <tr><td style="height:26px; line-height:26px; font-size:0;">&nbsp;</td></tr>

          {#- Powered-by footer -#}
          <tr>
            <td align="center" style="padding:18px 32px 22px; background:#f7f9fc; border-top:1px solid #e9eef5;">
              <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                <td valign="middle" style="font-size:12px; color:#94a3b8;"><a href="https://gettspro.com" target="_blank" style="color:#94a3b8; text-decoration:none;">Powered by</a></td>
                {% if tspro_logo_url %}
                <td valign="middle" style="padding-left:7px;"><a href="https://gettspro.com" target="_blank" style="text-decoration:none;"><img src="{{ tspro_logo_url }}" alt="Trusted Servants Pro" height="18" style="height:18px; width:auto; display:block; border:0;"></a></td>
                {% else %}
                <td valign="middle" style="padding-left:4px; font-size:12px; font-weight:700;"><a href="https://gettspro.com" target="_blank" style="color:#0b5cff; text-decoration:none;">Trusted Servants&nbsp;Pro</a></td>
                {% endif %}
              </tr></table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
