name: pip-audit

# Scans the pinned dependencies in requirements.txt for known CVEs.
# Runs on every push/PR that touches the requirements file, and on a
# weekly schedule so a newly-disclosed CVE in an already-pinned package
# is surfaced even when nothing changed in the repo.

on:
  push:
    paths:
      - "requirements.txt"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/pip-audit.yml"
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit pinned requirements
        # --strict fails the job on any vulnerability. Auditing the
        # requirements file directly (not the installed env) keeps the
        # scan hermetic and fast, and mirrors what ships in the image.
        run: pip-audit --strict --requirement requirements.txt
