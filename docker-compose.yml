services:
  tsp:
    build: .
    container_name: tspro
    ports:
      - "8090:8000"
    volumes:
      - ./data:/data
      - /proc:/host/proc:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/hostname:/host/etc/hostname:ro
    environment:
      - TSP_SECRET_KEY=${TSP_SECRET_KEY:?TSP_SECRET_KEY must be set in .env}
      # First-boot admin seed. Without TSP_ADMIN_PASSWORD the app refuses
      # to seed (and won't boot on an empty DB) unless TSP_DEBUG=1, which
      # falls back to admin/admin for local dev. Production should use
      # docker-compose.deploy.yml / install.sh, which require a real
      # password up front.
      - TSP_ADMIN_USERNAME=${TSP_ADMIN_USERNAME:-admin}
      - TSP_ADMIN_PASSWORD=${TSP_ADMIN_PASSWORD:-}
      - TSP_ADMIN_EMAIL=${TSP_ADMIN_EMAIL:-admin@example.com}
      # Local dev only — set TSP_DEBUG=1 in .env to serve over HTTP
      # without the Secure cookie flag and enable Flask debug. Leave
      # unset in production: it drops SESSION_COOKIE_SECURE and enables
      # the admin/admin seed fallback.
      - TSP_DEBUG=${TSP_DEBUG:-0}
      - TSP_HOST_PROC=/host/proc
      - TSP_HOST_ETC=/host/etc
    restart: unless-stopped
    # Cap container logs so an unattended box can't fill its disk with
    # JSON log files over time (default json-file driver is unbounded).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
